[package]
name = "shorui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDF operations behind Shorui. No UI, no network."

[features]
default = ["set-organise", "set-edit", "set-convert", "set-optimise"]
set-organise = []
set-edit = []
set-convert = []
set-optimise = []

[[bin]]
name = "shorui-cli"
path = "src/bin/shorui-cli.rs"

[dependencies]
lopdf = "0.45"
hayro = "0.7"
hayro-interpret = "0.7"
hayro-syntax = "0.7"
krilla = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
thiserror = "2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

# --- set-organise dependencies go below this line ---
# Random bytes for encryption keys and file identifiers (already in the tree through lopdf).
getrandom = "0.4"
# Opening old-style encrypted files with their owner password (already in the tree through lopdf).
md-5 = "0.11"

# --- set-edit dependencies go below this line ---

# --- set-convert dependencies go below this line ---

# --- set-optimise dependencies go below this line ---

# OCR on Windows uses the engine built into the system (Windows.Media.Ocr), offline.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections"] }
