[package]
name = "shorui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shorui: an offline, all-in-one PDF toolbox"

[dependencies]
gpui-kit = "0.7"
shorui-core = { path = "../shorui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rust-embed = "8"
image = { version = "0.25", default-features = false }
smallvec = "1"
anyhow = "1"
futures = "0.3"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
